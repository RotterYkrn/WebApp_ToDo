services:

  webapp:
    
    environment:
      CHOKIDAR_USEPOLLIN: true
      
    tty: true
      
    networks:
      - app-network
  
  mysql:

    build: 
      context: ./db/mysql

    env_file:
      - ./db/mysql/.env

    ports:
      - "3306:3306"

    volumes:
      - db-data:/var/lib/mysql
      
    networks:
      - app-network
  
  postgres:

    build: 
      context: ./db/postgres

    env_file:
      - ./db/postgres/.env

    ports:
      - "5432:5432"

    volumes:
      - db-data:/var/lib/postgresql/data

    networks:
      - app-network
